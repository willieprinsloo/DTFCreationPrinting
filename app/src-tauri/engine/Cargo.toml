[package]
name = "dtf-engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "dtf_engine"

[dependencies]
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
lcms2 = { version = "6.2.0", optional = true, features = ["static"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[[bin]]
name = "prn-tool"
path = "src/bin/prn-tool.rs"

[features]
default = ["icc"]
icc = ["dep:lcms2"]
